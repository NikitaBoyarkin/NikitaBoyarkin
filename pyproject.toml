[project]
name = "nikitaboyarkin-profile"
version = "0.0.0"
description = "Self-hosted GitHub profile assets for github.com/NikitaBoyarkin"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scripts/ is not a package: tests must mutate sys.path before importing it.
"tests/*" = ["E402", "I001"]
