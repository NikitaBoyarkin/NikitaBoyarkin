name: Build Profile

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_profile.py"
      - ".github/workflows/profile.yml"

concurrency:
  group: profile-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.STREAK_PAT }}
          fetch-depth: 0

      - name: Build self-hosted profile assets
        env:
          GH_TOKEN: ${{ secrets.STREAK_PAT }}
          GH_USER: NikitaBoyarkin
        run: python3 scripts/build_profile.py

      - name: Validate generated assets
        # The commit below carries [skip ci], so this is the only place the
        # published artifacts are ever checked. A green run that wrote nothing is
        # the failure mode this step exists to catch.
        run: |
          set -euo pipefail
          pip install --quiet pytest pytest-cov
          pytest -q
          for f in hero.svg stats.svg activity.svg top-languages.svg metrics.svg \
                   monthly-activity.svg contribution-types.svg \
                   projects.svg; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
            grep -q "</svg>" "$f" || { echo "::error::$f is not a closed SVG"; exit 1; }
          done

      - name: Commit profile assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile assets [skip ci]"
          file_pattern: "hero.svg stats.svg activity.svg top-languages.svg metrics.svg monthly-activity.svg contribution-types.svg projects.svg README.md"
