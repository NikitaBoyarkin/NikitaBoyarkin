name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check scripts tests

      - name: Test
        run: pytest --cov=scripts --cov-report=term-missing

      - name: Audit committed artifacts
        # Local, token-free: dead asset refs, orphan SVGs, size budget, and every
        # number the README states in prose against the generated llms.txt.
        run: python3 scripts/build_profile.py --audit

  project-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Every project link must resolve
        run: |
          set -euo pipefail
          links=$(python3 scripts/build_profile.py --print-project-links)
          test -n "$links" || { echo "ledger has no project links"; exit 1; }
          for url in $links; do
            echo "checking $url"
            curl -fsSL --retry 2 --max-time 20 -o /dev/null "$url"
          done
