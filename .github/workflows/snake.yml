name: Generate Snake

on:
  schedule:
    - cron: "17 3 * * *" # daily ~03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: NikitaBoyarkin
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Move SVGs to repo root
        run: |
          cp dist/github-contribution-grid-snake.svg github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg github-contribution-grid-snake-dark.svg

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "chore: refresh contribution-grid snake" || echo "no changes to commit"
          git push
