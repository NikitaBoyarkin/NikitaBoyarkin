name: Update Recent Notes

on:
  schedule:
    - cron: "33 3 * * *" # daily ~03:33 UTC
  workflow_dispatch:

concurrency:
  group: update-notes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update recent notes from RSS
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "RECENT-POSTS-LIST"
          max_post_count: "5"
          feed_list: "https://nikitaboyarkin.github.io/Personal_Projects.github.io/rss.xml"
          commit_message: "chore: update recent notes from RSS [skip ci]"
          # REQ-019: no dummy/keepalive commits — daily build already keeps the repo active.
          enable_keepalive: "false"
          # REQ-023: consistent UTM scheme for outbound section links.
          template: "- [$title]($url?utm_source=github&utm_medium=profile_readme&utm_campaign=notes)"
          tag_post_pre_newline: "true"
